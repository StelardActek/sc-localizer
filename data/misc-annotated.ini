TheCollector_ShipMod_URSA_Medivac_VehicleDesc=Manufacturer: RSI\nFocus: Medical\n \nEven in the most remote of planetside destinations, there are people who could use a helping hand. Designed by RSI to cross even the most rugged terrain, the Nursa features a Tier 3 Medical Bed ideal for offering aid wherever its needed most.\n\nWikelo here. Made change here. Add parts to give a little more use. Hope you like.

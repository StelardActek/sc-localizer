Stanton1_Desc=A wealth of ore and other resources are mined on Hurston to manufacture the company’s line of munitions and weapons. Heavy industry has resulted in severe pollution across the planet.\n\nPotential Ship Mineables:\nAluminium\nTin\nOuratite\nQuantainium\n\nPotential Hand Mineables:\nAphorite\nDolivine\nHadanite\nJanalite (Caves only)\n\nPotential Harvestables:\nPitambu\nGolden Medmon\nDegnous Root\nCompBoard\nProta\nRevenant Pod\nRanta Dung (Caves)\nAmioshi Plague (Caves)\nBluemoon Fungus (Caves)\n\nPotential Creatures:\nKopion \nMarok\nQuasigrazer\nJuvenile Valakkar
Stanton1a_Desc=This moon was named after the 3rd CEO of Hurston Dynamics, Arial Hurston, who was known for creating the controversial Life/Labor-style employee contract.\n\nPotential Ship Mineables:\nAluminium\nTin\nHephaestanite\nCorundum\nOuratite\nQuantainium\n\nPotential Hand Mineables:\nAphorite\nDolivine\nHadanite\nJanalite (Caves only)\n\nPotential Harvestables:\nRanta Dung (Caves)\nAmioshi Plague (Caves)\nBluemoon Fungus (Caves)
Stanton1b_Desc=This moon was named after scientist Aberdeen Hurston who was credited with designing the company's first antimatter warhead. \n\nPotential Ship Mineables:\nAluminium\nTitanium\nOuratite\nQuantainium\n\n\nPotential Hand Mineables:\nAphorite\nDolivine\nHadanite\nJanalite (Caves only)\n\nPotential Harvestables:\nRanta Dung (Caves)\nAmioshi Plague (Caves)\nBluemoon Fungus (Caves)
Stanton1c_Desc=This moon was named after Hurston Dynamics CEO Magda Hurston who made the decision to purchase Stanton I from the UEE. Magda is the mother of current CEO “Colonel” Gavin E. Hurston.\n\nPotential Ship Mineables:\nAluminium\nTitanium\nAslarite\nQuantainium\n\n\nPotential Hand Mineables:\nAphorite\nDolivine\nHadanite\nJanalite (Caves only)\n\nPotential Harvestables:\nRanta Dung (Caves)\nAmioshi Plague (Caves)\nBluemoon Fungus (Caves)
VanillaCheesecake_CFP_A_Desc,P=SETTLEMENT RESUPPLY NEEDED\n\nCitizens For Prosperity are a peaceful organization who are spearheading a campaign to support law-abiding settlements in Pyro in an effort to promote the growth of good and change the entire moral landscape of the system.\n\nWe’re looking for pilots to procure the following supplies and take them to ~mission(Destination|address). Since Pyro is so dangerous, we’ll have a CFP member on standby to take goods from the drop off and make the jump into Pyro themselves to distribute them.\n\nYou’re welcome to acquire the following materials wherever you can, but here’s a list of a few suggested locations where you can find what we currently need:\n\n*Agricultural Supplies - Can be bought at numerous research and mining facilities, including Hickes Research Outpost on Cellin and HDMS-Woodruff on Ita. \n*Aluminium - Mine and process your own, or purchase from mining facilities, like Shubin Mining Facility SMO-22 on microTech.  \n*Nitrogen - Can be bought from Beautiful Glen Station.\n\nYou'll also get a complete list of the required amounts upon acceptance, but they should range between 2-4 SCU per item.\n\n\nFly Safe,\n\nLima Endicott\nLead Dispatcher\nCitizens for Prosperity
item_Descbehr_ltm_kinetic_01,P=Manufacturer: Behring\nItem Type: Laser Mine\n\nArea of Effect: 15 m\nDamage Type: Kinetic\n\nhe ADO-5, or commonly called ADOSS is a Laser Mine from Behring. It is a deadly tool you want to own to protect your precious goods, but you never want to accidentally step into. Where ADO stand for Area Denial Ordnance you can be sure that your property is well protected.\n\nThis deadly gadget is made of an light weight aluminium case that holds a strong explosive. It can be easily attached to any surface with our state of the art attachment technology.\n\nThe laser beam comes in predefined lengths for all your use cases, to provide a good variance for various room types, hallways or even giant hangars. \n\nHandle with care! Once activated the only way to turn it off is by destruction.
